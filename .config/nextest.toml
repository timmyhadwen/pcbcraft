# cargo-nextest settings. CI selects the `ci` profile with NEXTEST_PROFILE=ci.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
# Report flaky tests instead of hiding them: no retries.
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
