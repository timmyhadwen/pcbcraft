# Release builds for every platform. Called by nightly.yml and release.yml so
# nightly runs exercise the exact packaging that a tagged release uses.
# No build cache here: release artifacts are built from a clean state.
#
# Linux: AppImage (+ .zsync), .deb, .rpm, FHS .tar.gz (Flatpak/Snap), then Flatpak and Snap
# repackage jobs. No Snap Store or Flathub upload in CI.
#
# docs-agent (D451): when Linux installers land, extend docs/ci.md Releases section with
# AppImage (+ .zsync), .deb, and .rpm per arch; point packaging/linux/package.sh for repro.
name: Build distributables

on:
  workflow_call:
    inputs:
      version:
        description: Version string used in archive names, for example v0.1.0 or nightly-20261028
        required: true
        type: string
      ref:
        description: Commit, branch or tag to build
        required: true
        type: string
      retention-days:
        required: false
        type: number
        default: 14

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  native:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            deb: amd64
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            deb: arm64
          - platform: windows-x86_64
            os: windows-2025
            targets: x86_64-pc-windows-msvc
          - platform: macos-universal
            os: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install window-system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: 2.47.0
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream zsync rpm \
            librsvg2-bin
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - name: Build release binaries
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --locked --release -p pcbcraft -p pcbcraft-cli --target "$target"
          done
      - name: Package Linux installers
        if: runner.os == 'Linux'
        shell: bash
        env:
          PCBCRAFT_DIST_TAG: ${{ inputs.version }}
          DIST: ${{ github.workspace }}/dist
          LINUX_TARGET: ${{ matrix.targets }}
        run: packaging/linux/package.sh --skip-build
      - name: Check Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          LINUX_TARGET: ${{ matrix.targets }}
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E 'usr/bin/pcbcraft$|usr/bin/pcbcraft-cli$|metainfo|applications|ATTRIBUTION.md'
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm | grep -E '/usr/bin/pcbcraft$|ATTRIBUTION.md'
          ldd "target/$LINUX_TARGET/release/pcbcraft"
          for appimage in dist/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --help
            "$appimage" --appimage-updateinformation | grep -F 'gh-releases-zsync|'
            test -s "$appimage.zsync"
          done
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/package.sh "$PLATFORM" "$VERSION" dist
      - name: Linux FHS tarball for Flatpak and Snap
        if: runner.os == 'Linux'
        shell: bash
        env:
          PCBCRAFT_DIST_TAG: ${{ inputs.version }}
          DIST: ${{ github.workspace }}/dist
          LINUX_TARGET: ${{ matrix.targets }}
        run: packaging/linux/package.sh --skip-build --formats tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: native
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: linux-x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, platform: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        shell: bash
        env:
          PCBCRAFT_DIST_TAG: ${{ inputs.version }}
          DIST: ${{ github.workspace }}/dist
        run: |
          tarball="dist/pcbcraft-$PCBCRAFT_DIST_TAG-linux-${{ matrix.arch }}.tar.gz"
          test -s "$tarball"
          packaging/linux/flatpak-bundle.sh --no-test "$tarball"
      - name: Version-less Flatpak name for latest download links
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          for f in dist/pcbcraft-"$VERSION"-linux-*.flatpak; do
            cp -- "$f" "dist/pcbcraft-${f#dist/pcbcraft-$VERSION-}"
          done
          ls -l dist/*.flatpak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  snap:
    name: Snap (${{ matrix.arch }})
    needs: native
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: linux-x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, platform: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Build the snap
        shell: bash
        env:
          PCBCRAFT_DIST_TAG: ${{ inputs.version }}
          DIST: ${{ github.workspace }}/dist
        run: |
          tarball="dist/pcbcraft-$PCBCRAFT_DIST_TAG-linux-${{ matrix.arch }}.tar.gz"
          test -s "$tarball"
          sudo --preserve-env=PCBCRAFT_DIST_TAG,DIST,PCBCRAFT_VERSION,VERSION,ROOT env "PATH=$PATH" \
            packaging/linux/snap-pack.sh --destructive-mode "$tarball"
          sudo chown -R "$(id -u):$(id -g)" dist target 2>/dev/null || sudo chown -R "$(id -u):$(id -g)" dist
      - name: Install and check the snap
        shell: bash
        env:
          PCBCRAFT_DIST_TAG: ${{ inputs.version }}
        run: |
          snap_file="dist/pcbcraft-$PCBCRAFT_DIST_TAG-linux-${{ matrix.arch }}.snap"
          sudo snap install --dangerous "$snap_file"
          snap info --verbose "$snap_file" | head -n 12
          pcbcraft.cli help >/dev/null
      - name: Version-less snap name for latest download links
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          for f in dist/pcbcraft-"$VERSION"-linux-*.snap; do
            cp -- "$f" "dist/pcbcraft-${f#dist/pcbcraft-$VERSION-}"
          done
          ls -l dist/*.snap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-snap-${{ matrix.arch }}
          path: dist/*.snap
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  web:
    name: Package (web)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: trunk
      - name: Build the browser bundle
        working-directory: apps/pcbcraft-web
        run: trunk build --release --public-url ./
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          name="pcbcraft-$VERSION-web"
          mkdir -p dist "stage/$name"
          cp -r apps/pcbcraft-web/dist/. "stage/$name/"
          cp LICENSE NOTICE ATTRIBUTION.md "stage/$name/"
          (cd stage && zip -qr "../dist/$name.zip" "$name")
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-web
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
