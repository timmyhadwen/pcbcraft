# Pull request and branch gate. Each job runs one `cargo xtask` step, so any
# failure can be reproduced locally with the same command. See docs/ci.md.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  # One run per pull request or branch. A new push cancels the older run,
  # except on main where every commit keeps its result.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  # Build dependencies needed by eframe's x11 and wayland features.
  LINUX_DEPS: libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev

jobs:
  changes:
    name: Changes
    # In the upstream repository, branch pushes other than main are covered by
    # their pull request. Forks run on every push so stacked branches get
    # results without waiting for workflow approval upstream.
    if: >-
      github.event_name != 'push'
      || github.ref == 'refs/heads/main'
      || github.repository != 'tangency-labs/pcbcraft'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: Skip heavy jobs for documentation-only changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" HEAD || true)
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit; running everything."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          code=$(printf '%s\n' "$changed" | grep -vE '^$|\.md$|^docs/|^LICENSE$|^NOTICE$|^\.github/ISSUE_TEMPLATE/' || true)
          if [ -n "$code" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed; skipping build jobs."
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  policy:
    name: Format and policy
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask policy
      - run: cargo xtask fmt

  lint:
    name: Clippy and docs
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install window-system packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_DEPS is a word list
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask clippy
      - run: cargo xtask docs

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install window-system packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_DEPS is a word list
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask test
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E stories and control coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install window-system packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_DEPS is a word list
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      # Runs every a_newcomer_* story, walks every page of the UI, and fails
      # naming each control that has no tooltip or no story.
      - run: cargo xtask e2e
      - name: Upload the control coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          path: target/e2e/
          if-no-files-found: ignore
          retention-days: 14

  # Waits on #349 (text catalog). When its extract command exists, replace
  # `if: false` with the rust condition and run it here; it must fail on any
  # user-visible string that is not in the catalog.
  strings:
    name: UI strings are in the catalog
    needs: changes
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo "skipped until #349 lands the text catalog extract command"

  wasm:
    name: WebAssembly
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask wasm

  msrv:
    name: Minimum Rust version
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install window-system packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_DEPS is a word list
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask msrv

  deny:
    name: Licenses and advisories
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask
          save-if: false
      - run: cargo xtask deny

  screenshots:
    name: UI screenshots (${{ matrix.side }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Pull requests also capture their base so reviewers can compare.
        side: ${{ fromJSON(github.event_name == 'pull_request' && '["head","base"]' || '["head"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the base commit next to the head
        if: matrix.side == 'base'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-tree
          persist-credentials: false
      - name: Install window-system and software rendering packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_DEPS is a word list
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS \
            xvfb xauth mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: screenshots
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.side == 'head' }}
      - name: Build the desktop app
        env:
          SIDE: ${{ matrix.side }}
        run: |
          # The base tree builds into the same target directory so both sides
          # share the cache and the binary path.
          if [ "$SIDE" = base ]; then
            CARGO_TARGET_DIR="$PWD/target" cargo build --locked -p pcbcraft --manifest-path base-tree/Cargo.toml
          else
            cargo build --locked -p pcbcraft
          fi
      - name: Capture views under Xvfb with Mesa software Vulkan
        env:
          SIDE: ${{ matrix.side }}
          WGPU_BACKEND: vulkan
        run: |
          xvfb-run -a -s '-screen 0 1600x1100x24' \
            env -u WAYLAND_DISPLAY \
            cargo xtask screenshots --bin target/debug/pcbcraft --out "screenshots/$SIDE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: screenshots-${{ matrix.side }}
          path: screenshots/${{ matrix.side }}
          if-no-files-found: warn
          retention-days: 30

  screenshot-sheet:
    name: UI screenshot sheet
    needs: screenshots
    if: ${{ !cancelled() && needs.screenshots.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots-head
          path: shots/head
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # Only pull requests capture a base.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: screenshots-base
          path: shots/base
      - name: Build one side-by-side sheet
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
          mkdir -p sheet
          args=()
          for head in shots/head/*.png; do
            name=$(basename "$head")
            base="shots/base/$name"
            if [ -d shots/base ]; then
              if [ -f "$base" ]; then args+=("$base"); else args+=("null:"); fi
            fi
            args+=("$head")
          done
          tile=1x
          [ -d shots/base ] && tile=2x
          montage "${args[@]}" -resize 50% -tile "$tile" -geometry +6+6 -background '#222' sheet/ui-screenshots.png
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots.png
          path: sheet/ui-screenshots.png
          archive: false
          retention-days: 30
      - name: Link the sheet from the run summary
        env:
          SHEET_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## UI screenshots"
            echo
            echo "[Open the screenshot sheet]($SHEET_URL). Left column is the base branch, right column is this change."
            echo "Full-size PNGs are in the screenshots-head and screenshots-base artifacts of [this run]($RUN_URL)."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows on every change; macOS on main, merge queue and manual runs.
        os: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && '["windows-2025"]' || '["windows-2025","macos-15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked -p pcbcraft -p pcbcraft-cli

  result:
    name: CI result
    # The single check to mark as required in branch protection.
    needs: [changes, policy, lint, test, e2e, wasm, msrv, deny, screenshots, build]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          if [ "$CHANGES" = skipped ]; then
            echo "Branch push covered by its pull request run."
            exit 0
          fi
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
