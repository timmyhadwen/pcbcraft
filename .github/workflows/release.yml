# Tagged release: build every platform, attach checksums and GPL source
# archives, and open a DRAFT GitHub Release. A maintainer reviews and
# publishes it by hand; this workflow never publishes.
#
# Primary packages are also attached without the tag in their names
# (pcbcraft-linux-x86_64.tar.gz, pcbcraft-windows-x86_64.zip, ...) so
# releases/latest/download/<name> links keep working across releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag=${INPUT_TAG:-$REF_NAME}
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $tag is not of the form vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - name: Tag matches the workspace version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "${TAG%%-*}" ] && [ "v$version" != "$TAG" ]; then
            echo "Cargo.toml version $version does not match tag $TAG" >&2
            exit 1
          fi

  dist:
    name: Distributables
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.verify.outputs.tag }}
      ref: refs/tags/${{ needs.verify.outputs.tag }}
      retention-days: 7

  source:
    name: Source archives
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Source tarball and vendored dependencies
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="pcbcraft-$TAG/" -o "dist/pcbcraft-$TAG-source.tar.gz" HEAD
          # Complete corresponding source for the binaries, including every
          # Rust dependency at the locked version, so the build works offline.
          stage="pcbcraft-$TAG"
          git archive --format=tar --prefix="$stage/" HEAD | tar -x
          (cd "$stage" && mkdir -p .cargo && cargo vendor --locked --versioned-dirs vendor >> .cargo/config.toml)
          tar -czf "dist/pcbcraft-$TAG-source-vendored.tar.gz" "$stage"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-source
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft GitHub Release
    needs: [verify, dist, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Version-less copies for permanent download links
        working-directory: dist
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          shopt -s nullglob
          for f in "pcbcraft-$TAG-"*; do
            case "$f" in
              *-source.tar.gz | *-source-vendored.tar.gz) ;;
              *.tar.gz | *.zip | *.dmg)
                cp -- "$f" "pcbcraft-${f#"pcbcraft-$TAG-"}" ;;
            esac
          done
          for f in pcbcraft-linux-x86_64.tar.gz pcbcraft-linux-aarch64.tar.gz \
            pcbcraft-windows-x86_64.zip pcbcraft-macos-universal.tar.gz \
            pcbcraft-macos-universal.dmg pcbcraft-web.zip; do
            test -s "$f" || { echo "missing version-less copy $f" >&2; exit 1; }
          done
          ls -l pcbcraft-linux-* pcbcraft-windows-* pcbcraft-macos-* pcbcraft-web.zip
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * | tee SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Changelog from commits since the previous tag
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range=${previous:+$previous..}$TAG
          {
            if [ -n "$previous" ]; then echo "Changes since $previous:"; else echo "Changes:"; fi
            echo
            git log --no-merges --reverse --format='- %s (%h)' "$range"
            echo
            echo "Binaries are not code-signed yet. Verify downloads against SHA256SUMS.txt."
            echo "The source archives are the complete corresponding source under GPL-3.0-or-later."
          } > notes.md
          cat notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            "${prerelease[@]}" --title "PCBCraft $TAG" --notes-file notes.md dist/*
