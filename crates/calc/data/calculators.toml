[[calculator]]
id = "decoupling_capacitor"
name = "Decoupling capacitor sizing"
group = "components"
summary = "Bulk capacitance for a current step within a ripple budget, and the self-resonant frequency above which a capacitor stops being one."
inputs = [
  { name = "current_step", unit = "A", range = [1.0e-6, 1000.0] },
  { name = "step_time", unit = "s", range = [1.0e-12, 1.0] },
  { name = "ripple", unit = "V", range = [1.0e-4, 10.0] },
  { name = "esl", unit = "H", range = [1.0e-12, 1.0e-6], default = 1.0e-9, description = "capacitor plus mounting inductance" },
  { name = "capacitance", unit = "F", range = [1.0e-12, 1.0], optional = true, description = "a chosen part, for its self-resonance" },
]
outputs = ["capacitance_needed F", "self_resonance Hz", "impedance_target ohm (ripple / current_step)"]
formula = "C = I dt / dV;  f_srf = 1 / (2 pi sqrt(ESL C));  Ztarget = dV / I."
source = "Analog Devices MT-101 'Decoupling Techniques' (manifest: https://www.analog.com/media/en/training-seminars/tutorials/MT-101.pdf); the charge-balance form is in any power integrity text (Bogatin, Signal and Power Integrity Simplified, ch. 13)."
validity = "First-order. Below the SRF the part is a capacitor; above it the mounting inductance dominates, so several values in parallel cover a wider band. Place small ones nearest the pin."
accuracy = "Order of magnitude starting point."
[[calculator.vector]]
inputs = { current_step = 1.0, step_time = 5e-9, ripple = 0.05 }
expect = { capacitance_needed = 1.0e-7, impedance_target = 0.05 }
tolerance = 1e-9
crosscheck = "1 A * 5 ns / 50 mV = 100 nF"
[[calculator.vector]]
inputs = { current_step = 0.5, step_time = 10e-9, ripple = 0.1 }
expect = { capacitance_needed = 5.0e-8 }
tolerance = 1e-9
crosscheck = "hand arithmetic"
[[calculator.vector]]
inputs = { current_step = 0.5, step_time = 10e-9, ripple = 0.1, esl = 1e-9, capacitance = 100e-9 }
expect = { self_resonance = 1.59155e7 }
tolerance = 1e-5
crosscheck = "1/(2 pi sqrt(1e-16)) = 15.9 MHz, the textbook 0603 100 nF SRF range"

[[calculator]]
id = "i2c_pullup"
name = "I2C pull-up resistor"
group = "components"
summary = "Smallest and largest pull-up for an I2C bus from supply, sink current, rise time budget and bus capacitance."
inputs = [
