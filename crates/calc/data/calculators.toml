# PCBCraft Help reference: calculators.
# Machine-readable companion to calculators.md. One [[calculator]] per tool.
# Every calculator becomes one engine read command `calc.<id>` (crates/calc, see
# calculators.md section "Where it lives") and one card in the Help Reference panel.
#
# Field notes
#   inputs[].range   closed interval the command accepts; outside it the command
#                    returns Error::Invalid with the range in the message.
#   formula          exact expression the implementation must use. SI units unless
#                    the unit column says otherwise.
#   accuracy         what the model claims against its own reference, never against
#                    reality; fabrication tolerance dominates.
#   vector           golden test. `expect` values were computed by
#                    pcbcraft-research/ee-thesaurus/vectors.py (stdlib Python) and
#                    cross-checked against the named reference. Tolerance is relative.
#
# Constants shared by several calculators (crates/calc/src/consts.rs):
#   RHO_CU   = 1.72e-8 ohm m   annealed copper at 20 C
#   ALPHA_CU = 0.00393 1/K     copper temperature coefficient of resistance
#   K_CU     = 385 W/(m K)     copper thermal conductivity
#   OZ_UM    = 34.79 um        copper thickness per oz/ft2 (fabs round to 35)
#   MIL_MM   = 0.0254 mm
#   C0       = 299792458 m/s
#   ZF0      = 376.730313668 ohm

schema_version = 1

# ---------------------------------------------------------------- basic circuit

[[calculator]]
id = "ohms_law"
name = "Ohm's law and power"
group = "basic"
summary = "Give any two of voltage, current and resistance; get the third and the power."
inputs = [
  { name = "voltage", unit = "V", range = [0.0, 1.0e6], optional = true },
  { name = "current", unit = "A", range = [0.0, 1.0e6], optional = true },
  { name = "resistance", unit = "ohm", range = [1.0e-9, 1.0e12], optional = true },
]
outputs = ["voltage V", "current A", "resistance ohm", "power W"]
formula = "V = I R; P = V I = I^2 R = V^2 / R. Exactly two inputs must be given."
source = "Ohm's law and Joule heating, any introductory circuits text (Horowitz and Hill, The Art of Electronics, 3rd ed., ch. 1)."
validity = "Linear resistors at DC or RMS AC. Not for reactive loads (use reactance)."
accuracy = "exact"
[[calculator.vector]]
inputs = { voltage = 12, resistance = 100 }
expect = { current = 0.12, power = 1.44 }
tolerance = 1e-9
crosscheck = "hand arithmetic"
[[calculator.vector]]
inputs = { current = 0.02, resistance = 330 }
expect = { voltage = 6.6, power = 0.132 }
tolerance = 1e-9
crosscheck = "hand arithmetic"
[[calculator.vector]]
inputs = { voltage = 5, current = 2 }
expect = { resistance = 2.5, power = 10 }
tolerance = 1e-9
crosscheck = "hand arithmetic"

[[calculator]]
id = "series_parallel"
name = "Series and parallel R, C, L"
group = "basic"
summary = "Combine up to 16 resistors, capacitors or inductors in series or in parallel."
inputs = [
  { name = "kind", unit = "enum", values = ["resistor", "capacitor", "inductor"] },
  { name = "values", unit = "ohm | F | H", range = [1.0e-15, 1.0e12], array = [2, 16] },
]
outputs = ["series", "parallel"]
formula = "R, L series = sum; parallel = 1 / sum(1/x). C is the reverse: parallel = sum, series = 1 / sum(1/x)."
source = "Kirchhoff's laws; any introductory text."
validity = "Ideal components."
accuracy = "exact"
[[calculator.vector]]
inputs = { kind = "resistor", values = [100, 220, 330] }
expect = { series = 650, parallel = 56.8966 }
tolerance = 1e-5
crosscheck = "hand arithmetic: 1/(0.01+0.0045455+0.0030303)"
[[calculator.vector]]
inputs = { kind = "capacitor", values = [1.0e-6, 2.2e-6] }
expect = { parallel = 3.2e-6, series = 6.875e-7 }
tolerance = 1e-5
crosscheck = "hand arithmetic"
[[calculator.vector]]
inputs = { kind = "inductor", values = [10e-6, 22e-6] }
expect = { series = 32e-6, parallel = 6.875e-6 }
tolerance = 1e-5
crosscheck = "hand arithmetic"

[[calculator]]
id = "voltage_divider"
name = "Voltage divider with load"
group = "basic"
summary = "Output voltage of two resistors, with an optional load resistor across the output."
inputs = [
  { name = "vin", unit = "V", range = [0.0, 1.0e5] },
  { name = "r1", unit = "ohm", range = [1.0e-3, 1.0e12] },
  { name = "r2", unit = "ohm", range = [1.0e-3, 1.0e12] },
  { name = "load", unit = "ohm", range = [1.0e-3, 1.0e12], optional = true },
]
outputs = ["vout V", "current A (through r1)", "r2_effective ohm", "power_r1 W", "power_r2 W"]
formula = "R2e = load given ? R2 || load : R2; Vout = Vin R2e / (R1 + R2e); I = Vin / (R1 + R2e)."
source = "Horowitz and Hill, The Art of Electronics, 3rd ed., section 1.2.3 (voltage dividers) and Thevenin loading."
validity = "Linear resistors; load modelled as a resistor to ground."
accuracy = "exact"
[[calculator.vector]]
inputs = { vin = 12, r1 = 10000, r2 = 4700 }
expect = { vout = 3.83673, current = 8.16327e-4 }
tolerance = 1e-5
crosscheck = "hand arithmetic 12*4700/14700"
[[calculator.vector]]
inputs = { vin = 12, r1 = 10000, r2 = 4700, load = 10000 }
expect = { vout = 2.90722 }
tolerance = 1e-5
crosscheck = "4700||10000 = 3197.3 ohm; 12*3197.3/13197.3"
[[calculator.vector]]
inputs = { vin = 3.3, r1 = 1000, r2 = 1000, load = 100000 }
expect = { vout = 1.64179 }
tolerance = 1e-5
crosscheck = "1000||100000 = 990.1; 3.3*990.1/1990.1"

[[calculator]]
id = "led_resistor"
name = "LED series resistor"
group = "basic"
summary = "Resistor for an LED from supply voltage, forward voltage and wanted current, with the resistor's power and the nearest E-series value."
inputs = [
  { name = "supply", unit = "V", range = [0.1, 1000.0] },
  { name = "forward_voltage", unit = "V", range = [0.1, 50.0] },
  { name = "current", unit = "A", range = [1.0e-6, 10.0] },
  { name = "series", unit = "enum", values = ["E6", "E12", "E24", "E96"], default = "E24" },
]
outputs = ["resistance ohm", "power W", "nearest_standard ohm", "current_with_standard A"]
formula = "R = (Vs - Vf) / I; P = (Vs - Vf) I. Refuse when Vf >= Vs."
source = "Ohm's law; typical Vf: red 1.8 to 2.2 V, green or blue or white 2.8 to 3.4 V (any LED datasheet)."
validity = "One LED or a series string whose total Vf is entered. Vf is current dependent, so the result is a starting point."
accuracy = "exact for the given Vf"
[[calculator.vector]]
inputs = { supply = 5, forward_voltage = 2.0, current = 0.02 }
expect = { resistance = 150, power = 0.06, nearest_standard = 150 }
tolerance = 1e-9
crosscheck = "hand arithmetic"
[[calculator.vector]]
inputs = { supply = 12, forward_voltage = 3.2, current = 0.35 }
expect = { resistance = 25.1429, power = 3.08, nearest_standard = 24 }
tolerance = 1e-5
crosscheck = "hand arithmetic; E24 nearest to 25.14 is 24 (log distance 0.0464 vs 27 at 0.0714)"
[[calculator.vector]]
inputs = { supply = 3.3, forward_voltage = 1.8, current = 0.005 }
expect = { resistance = 300, power = 0.0075, nearest_standard = 300 }
tolerance = 1e-9
crosscheck = "hand arithmetic"

[[calculator]]
id = "rc_rl_time_constant"
name = "RC and RL time constant and cutoff"
group = "basic"
summary = "Time constant and the -3 dB corner frequency of a first-order RC or RL network."
inputs = [
  { name = "kind", unit = "enum", values = ["rc", "rl"] },
  { name = "resistance", unit = "ohm", range = [1.0e-3, 1.0e12] },
  { name = "capacitance", unit = "F", range = [1.0e-15, 1.0], optional = true },
  { name = "inductance", unit = "H", range = [1.0e-12, 1.0e3], optional = true },
]
outputs = ["tau s", "cutoff Hz", "t_63 s", "t_95 s (3 tau)", "t_99 s (5 tau)"]
formula = "RC: tau = R C. RL: tau = L / R. fc = 1 / (2 pi tau)."
source = "First-order response; Horowitz and Hill, 3rd ed., section 1.4.2 and 1.7.1."
validity = "Single-pole networks only."
accuracy = "exact"
[[calculator.vector]]
inputs = { kind = "rc", resistance = 10000, capacitance = 100e-9 }
expect = { tau = 1.0e-3, cutoff = 159.155 }
tolerance = 1e-5
crosscheck = "1/(2 pi 1e-3) = 159.15 Hz"
[[calculator.vector]]
inputs = { kind = "rl", resistance = 50, inductance = 10e-3 }
expect = { tau = 2.0e-4, cutoff = 795.775 }
tolerance = 1e-5
crosscheck = "50/(2 pi 0.01)"
[[calculator.vector]]
inputs = { kind = "rc", resistance = 1000, capacitance = 1e-6 }
expect = { tau = 1.0e-3, cutoff = 159.155 }
tolerance = 1e-5
crosscheck = "same tau as the first vector"

[[calculator]]
id = "lc_resonance"
name = "Resonant frequency"
group = "basic"
summary = "Resonant frequency of an inductor and capacitor, or the L or C needed for a target frequency."
inputs = [
  { name = "inductance", unit = "H", range = [1.0e-12, 1.0e3], optional = true },
  { name = "capacitance", unit = "F", range = [1.0e-15, 1.0], optional = true },
  { name = "frequency", unit = "Hz", range = [1.0e-3, 1.0e12], optional = true },
]
outputs = ["frequency Hz", "inductance H", "capacitance F", "characteristic_impedance ohm (sqrt(L/C))"]
formula = "f0 = 1 / (2 pi sqrt(L C)); solve for the missing one of the three."
source = "Thomson's formula; any circuits text."
validity = "Lossless LC. Real parts shift f0 by their parasitics."
accuracy = "exact"
[[calculator.vector]]
inputs = { inductance = 10e-6, capacitance = 100e-9 }
expect = { frequency = 159155 }
tolerance = 1e-5
crosscheck = "sqrt(1e-12) = 1e-6; 1/(2 pi 1e-6)"
[[calculator.vector]]
inputs = { inductance = 1e-3, capacitance = 1e-6 }
expect = { frequency = 5032.92 }
tolerance = 1e-5
crosscheck = "1/(2 pi sqrt(1e-9))"
[[calculator.vector]]
inputs = { inductance = 2.2e-6, capacitance = 22e-12 }
expect = { frequency = 2.28769e7 }
tolerance = 1e-5
crosscheck = "sqrt(4.84e-17) = 6.957e-9"

[[calculator]]
id = "reactance"
name = "Reactance"
group = "basic"
summary = "Reactance of a capacitor or inductor at a frequency."
inputs = [
  { name = "frequency", unit = "Hz", range = [1.0e-3, 1.0e12] },
  { name = "capacitance", unit = "F", range = [1.0e-15, 1.0], optional = true },
  { name = "inductance", unit = "H", range = [1.0e-12, 1.0e3], optional = true },
]
outputs = ["xc ohm", "xl ohm"]
formula = "Xc = 1 / (2 pi f C); Xl = 2 pi f L."
source = "Any circuits text."
validity = "Ideal components; ignores ESR and self resonance."
accuracy = "exact"
[[calculator.vector]]
inputs = { frequency = 1000, capacitance = 1e-6 }
expect = { xc = 159.155 }
tolerance = 1e-5
crosscheck = "hand arithmetic"
[[calculator.vector]]
inputs = { frequency = 1e6, inductance = 10e-6 }
expect = { xl = 62.8319 }
tolerance = 1e-5
crosscheck = "2 pi 10 = 62.83"
[[calculator.vector]]
inputs = { frequency = 100e6, capacitance = 100e-9 }
expect = { xc = 0.0159155 }
tolerance = 1e-5
crosscheck = "hand arithmetic"

[[calculator]]
id = "decibel"
name = "Decibel conversions"
group = "basic"
summary = "Convert between power ratio, voltage ratio, dB, dBm and watts."
inputs = [
  { name = "mode", unit = "enum", values = ["power_ratio", "voltage_ratio", "dbm_to_w", "w_to_dbm"] },
  { name = "value", unit = "ratio | dB | dBm | W", range = [-300.0, 1.0e12] },
]
outputs = ["db", "ratio", "dbm", "watts"]
formula = "dB(power) = 10 log10(P2/P1); dB(voltage, equal impedance) = 20 log10(V2/V1); dBm = 10 log10(P / 1 mW); P = 1 mW * 10^(dBm/10)."
source = "IEEE Std 100 definitions; any RF text."
validity = "Voltage form assumes equal source and load impedance."
accuracy = "exact"
[[calculator.vector]]
inputs = { mode = "power_ratio", value = 2 }
expect = { db = 3.0103 }
tolerance = 1e-5
crosscheck = "10 log10 2"
[[calculator.vector]]
inputs = { mode = "voltage_ratio", value = 10 }
expect = { db = 20 }
tolerance = 1e-9
crosscheck = "20 log10 10"
[[calculator.vector]]
inputs = { mode = "w_to_dbm", value = 0.5 }
expect = { dbm = 26.9897 }
tolerance = 1e-5
crosscheck = "10 log10(500)"
[[calculator.vector]]
inputs = { mode = "dbm_to_w", value = 30 }
expect = { watts = 1.0 }
tolerance = 1e-9
crosscheck = "30 dBm is 1 W by definition"

# ---------------------------------------------------------------- copper and current

[[calculator]]
id = "trace_width"
name = "Trace width for current"
group = "copper"
summary = "Minimum copper width for a current and allowed temperature rise. IPC-2152 table lookup when inside its published range, IPC-2221 formula otherwise, both stated."
inputs = [
  { name = "current", unit = "A", range = [0.001, 100.0] },
  { name = "temperature_rise", unit = "K", range = [1.0, 100.0], default = 10 },
  { name = "copper_weight", unit = "oz/ft2", range = [0.25, 6.0], default = 1 },
  { name = "layer", unit = "enum", values = ["external", "internal"], default = "external" },
  { name = "method", unit = "enum", values = ["auto", "ipc2152", "ipc2221"], default = "auto" },
]
outputs = ["width mm", "width mil", "cross_section mil2", "method_used", "notes"]
formula = """
IPC-2221 (closed form, both layers): I = k dT^0.44 A^0.725, A in mil^2, k = 0.048 external, 0.024 internal.
  A = (I / (k dT^0.44))^(1/0.725); width_mil = A / thickness_mil; thickness_mil = oz * 34.79 / 25.4.
IPC-2152 (table, used by `auto` only when layer = external, copper_weight = 1 and 1 A <= I <= 10 A and dT = 10 K):
  log-log interpolation in the published 1 oz / 10 K external table
  (A, mil): (1,10) (2,30) (3,50) (4,80) (5,110) (6,150) (7,180) (8,220) (9,260) (10,300).
  Other copper weights scale width by 1/oz as a stated approximation (constant cross-section), flagged in notes.
"""
source = """
IPC-2221 constants: Sierra Circuits, "How to optimize your PCB trace using IPC-2152" (sources/standards/ipc2152-protoexpress.txt) and Altium IPC-2221 calculator page (sources/standards/ipc2221-trace-calc-altium.txt); the standard itself is paywalled (IPC-2221C, shop.ipc.org).
IPC-2152 table: Altium, "PCB trace width vs current table" (sources/standards/ipc2152-altium-width-table.txt), a secondary reproduction of one IPC-2152 chart; the standard is paywalled (shop.ipc.org/ipc-2152).
Cross-check table: Philip McGaw trace width vs current table (sources/standards/trace-width-philipmcgaw.txt).
"""
validity = """
IPC-2221 curves come from 1950s test boards; the standard describes them as conservative. Assumptions stated to the user: still air, no adjacent copper planes, trace length much longer than width, FR-4.
IPC-2152 published chart only covers 1 oz external copper at 10 K rise here; anything else falls back to IPC-2221 and the notes say so.
Internal layers: IPC-2152 found internal and external traces behave about the same when a plane is nearby; IPC-2221 halves internal current. The notes mention this.
"""
accuracy = "IPC-2221: matches the published 10 K table within 1 % (the 1 % is the 34.79 vs 35 um copper rounding). IPC-2152: interpolation of a secondary reproduction; treat as +-10 %."
[[calculator.vector]]
inputs = { current = 1, temperature_rise = 10, copper_weight = 1, layer = "external", method = "ipc2221" }
expect = { cross_section = 16.296, width_mm = 0.3022, width_mil = 11.8976 }
tolerance = 1e-4
crosscheck = "Philip McGaw table: 1 A external 1 oz 10 C = 0.300 mm (0.7 % diff from copper thickness rounding)"
[[calculator.vector]]
inputs = { current = 2, temperature_rise = 10, copper_weight = 1, layer = "external", method = "ipc2221" }
expect = { cross_section = 42.3931, width_mm = 0.786154 }
tolerance = 1e-4
crosscheck = "Philip McGaw table: 2 A external 1 oz = 0.781 mm"
[[calculator.vector]]
inputs = { current = 3, temperature_rise = 10, copper_weight = 1, layer = "internal", method = "ipc2221" }
expect = { cross_section = 192.927, width_mm = 3.57772 }
tolerance = 1e-4
crosscheck = "Philip McGaw table: 3 A internal 1 oz = 3.56 mm"
[[calculator.vector]]
inputs = { current = 2, temperature_rise = 20, copper_weight = 2, layer = "external", method = "ipc2221" }
expect = { cross_section = 27.8356, width_mm = 0.258097 }
tolerance = 1e-4
crosscheck = "vectors.py; dT^0.44 = 20^0.44 = 3.737"
[[calculator.vector]]
inputs = { current = 2, temperature_rise = 10, copper_weight = 1, layer = "external", method = "ipc2152" }
expect = { width_mil = 30, width_mm = 0.762 }
tolerance = 1e-9
crosscheck = "table row read directly"
[[calculator.vector]]
inputs = { current = 2.5, temperature_rise = 10, copper_weight = 1, layer = "external", method = "ipc2152" }
expect = { width_mil = 39.7387, width_mm = 1.00936 }
tolerance = 1e-4
crosscheck = "log-log between (2,30) and (3,50)"
[[calculator.vector]]
inputs = { current = 5, temperature_rise = 10, copper_weight = 1, layer = "external", method = "ipc2152" }
expect = { width_mil = 110, width_mm = 2.794 }
tolerance = 1e-9
crosscheck = "table row read directly"

[[calculator]]
id = "via_current_resistance"
name = "Via current and resistance"
group = "copper"
summary = "Current a plated via carries for a temperature rise, its DC resistance, and how many vias in parallel reach a target current."
inputs = [
  { name = "drill", unit = "mm", range = [0.05, 10.0] },
  { name = "plating", unit = "um", range = [5.0, 100.0], default = 25 },
  { name = "length", unit = "mm", range = [0.1, 10.0], default = 1.6 },
  { name = "temperature_rise", unit = "K", range = [1.0, 100.0], default = 10 },
  { name = "target_current", unit = "A", range = [0.001, 100.0], optional = true },
]
outputs = ["barrel_area mm2", "current A", "resistance ohm", "count (for target_current)"]
formula = """
A = pi/4 ((drill + 2 plating)^2 - drill^2)  [mm^2]; A_mil2 = A / 0.0254^2.
I = 0.024 dT^0.44 A_mil2^0.725   (IPC-2221 internal-conductor constant, the usual via convention).
R = RHO_CU length / A.  count = ceil(target_current / I).
"""
source = "IPC-2221 formula as for trace_width; via convention (barrel area with internal k) as described in Altium 'PCB via size and pad size guidelines' (sources/standards/via-pad-size-altium.txt). Copper resistivity 1.72e-8 ohm m (CRC Handbook)."
validity = "Plating thickness is what the fab actually deposits (IPC-6012 Class 2 average 20 um, Class 3 25 um); barrel resistance ignores the pad to barrel transition."
accuracy = "same as IPC-2221; resistance exact for the modelled cylinder"
[[calculator.vector]]
inputs = { drill = 0.3, plating = 25, length = 1.6, temperature_rise = 10 }
expect = { barrel_area = 0.0255254, current = 0.95117, resistance = 1.07814e-3 }
tolerance = 1e-4
crosscheck = "hand: A = pi/4 (0.35^2 - 0.3^2) = 0.02553 mm2; R = 1.72e-8 * 1.6e-3 / 2.553e-8"
[[calculator.vector]]
inputs = { drill = 0.5, plating = 25, length = 1.6, temperature_rise = 10 }
expect = { barrel_area = 0.0412334, current = 1.34666, resistance = 6.6742e-4 }
tolerance = 1e-4
crosscheck = "vectors.py"
[[calculator.vector]]
inputs = { drill = 0.2, plating = 20, length = 1.0, temperature_rise = 10, target_current = 3 }
expect = { barrel_area = 0.013823, current = 0.609732, resistance = 1.2443e-3, count = 5 }
tolerance = 1e-4
crosscheck = "ceil(3 / 0.6097) = 5"

[[calculator]]
id = "trace_resistance_drop"
name = "Trace resistance and voltage drop"
group = "copper"
summary = "DC resistance of a copper trace at a temperature, and the voltage drop and heat at a current."
inputs = [
  { name = "width", unit = "mm", range = [0.01, 100.0] },
  { name = "copper_weight", unit = "oz/ft2", range = [0.25, 6.0], default = 1 },
  { name = "length", unit = "mm", range = [0.1, 10000.0] },
  { name = "current", unit = "A", range = [0.0, 100.0], default = 0 },
  { name = "temperature", unit = "C", range = [-55.0, 200.0], default = 20 },
]
outputs = ["resistance ohm", "voltage_drop V", "power W"]
formula = "t = oz * 34.79e-6 m; R20 = RHO_CU L / (w t); R = R20 (1 + ALPHA_CU (T - 20)); V = I R; P = I^2 R."
source = "Resistivity and temperature coefficient of copper, CRC Handbook of Chemistry and Physics (1.72e-8 ohm m, 0.00393 /K)."
validity = "DC and low frequency. Above about 1 MHz skin depth (66 um at 1 MHz for copper) makes the effective thickness smaller; a note says so when the user enters a frequency in the future."
accuracy = "exact for the model; real copper is 2 to 10 % thinner than nominal after etching"
[[calculator.vector]]
inputs = { width = 0.25, copper_weight = 1, length = 100, current = 0.5, temperature = 20 }
expect = { resistance = 0.197758, voltage_drop = 0.098879, power = 0.0494395 }
tolerance = 1e-4
crosscheck = "hand: 1.72e-8 * 0.1 / (0.25e-3 * 34.79e-6)"
[[calculator.vector]]
inputs = { width = 1.0, copper_weight = 1, length = 50, current = 2.0, temperature = 20 }
expect = { resistance = 0.0247197, voltage_drop = 0.0494395 }
tolerance = 1e-4
crosscheck = "quarter width x half length of vector 1 gives one eighth the resistance"
[[calculator.vector]]
inputs = { width = 0.25, copper_weight = 1, length = 100, current = 0.5, temperature = 70 }
expect = { resistance = 0.236617, voltage_drop = 0.118309 }
tolerance = 1e-4
crosscheck = "vector 1 times (1 + 0.00393 * 50) = 1.1965"

# ---------------------------------------------------------------- impedance and signal integrity

[[calculator]]
id = "microstrip"
name = "Microstrip impedance"
group = "impedance"
summary = "Characteristic impedance and effective permittivity of a surface trace over one plane, or the width for a target impedance."
model = "Hammerstad and Jensen 1980 quasi-static, with the Hammerstad thickness correction"
inputs = [
  { name = "width", unit = "mm", range = [0.01, 100.0], optional = true },
  { name = "height", unit = "mm", range = [0.01, 10.0] },
  { name = "er", unit = "", range = [1.0, 20.0] },
  { name = "thickness", unit = "mm", range = [0.0, 0.5], default = 0.035 },
  { name = "target", unit = "ohm", range = [1.0, 1000.0], optional = true },
]
outputs = ["z0 ohm", "eeff", "delay ps/mm", "width_for_target mm"]
formula = """
u = w/h, ZF0 = 376.730313668.
ZL1(u) = ZF0/(2 pi) ln( f(u)/u + sqrt(1 + (2/u)^2) ),  f(u) = 6 + (2 pi - 6) exp( -(30.666/u)^0.7528 )
eeff(u, er) = (er+1)/2 + (er-1)/2 (1 + 10/u)^(-a b)
a(u) = 1 + ln( (u^4 + (u/52)^2) / (u^4 + 0.432) )/49 + ln( 1 + (u/18.1)^3 )/18.7
b(er) = 0.564 ((er - 0.9)/(er + 3))^0.053
thickness (tn = t/h): du1 = tn/pi ln( 1 + 4e/tn tanh^2( sqrt(6.517 u) ) ); dur = du1 (1 + sech( sqrt(er - 1) ))/2; u1 = u + du1; ur = u + dur
Z0 = ZL1(ur) / sqrt(eeff(ur, er)); eeff_t = eeff(ur, er) (ZL1(u1)/ZL1(ur))^2
delay = sqrt(eeff_t) / C0.
width_for_target: bisection of Z0(w) on [0.01, 100] mm, 80 steps (Z0 is monotonic in w).
"""
source = "Qucs technical documentation, microstrip line, https://qucs.sourceforge.net/tech/node75.html (transcription checked in pcbcraft-research/research-283-length-impedance.md); independent implementation scikit-rf MLine (BSD-3) https://scikit-rf.readthedocs.io/en/latest/_modules/skrf/media/mline.html. Original: E. Hammerstad and O. Jensen, 'Accurate models for microstrip computer-aided design', IEEE MTT-S 1980."
validity = "0.01 <= w/h <= 100, er < 128 (fit range). Quasi-static: no dispersion, fine below a few GHz on FR-4. Solder mask not modelled (lowers Z0 by 1 to 3 ohm)."
accuracy = "Fit error 0.01 % (w/h <= 1) and 0.03 % (w/h <= 1000) for Z0 against the zero-thickness quasi-static solution; eeff within 0.2 %. Fabrication tolerance on h and er dominates (5 to 10 %)."
[[calculator.vector]]
inputs = { width = 1.0, height = 1.6, er = 4.5, thickness = 0.035 }
expect = { z0 = 85.0992, eeff = 3.09458, delay = 5.86786 }
tolerance = 1e-4
crosscheck = "research-283-length-impedance.md H-J column: 85.10 ohm"
[[calculator.vector]]
inputs = { width = 2.0, height = 1.6, er = 4.5, thickness = 0.035 }
expect = { z0 = 62.146, eeff = 3.25145 }
tolerance = 1e-4
crosscheck = "research-283 table: 62.15 ohm"
[[calculator.vector]]
inputs = { width = 0.2, height = 1.6, er = 4.5, thickness = 0.035 }
expect = { z0 = 137.798 }
tolerance = 1e-4
crosscheck = "research-283 table: 137.80 ohm"
[[calculator.vector]]
inputs = { height = 1.6, er = 4.5, thickness = 0.035, target = 50 }
expect = { width_for_target = 2.96591 }
tolerance = 1e-3
crosscheck = "research-283: 50 ohm H-J width 2.966 mm"
[[calculator.vector]]
inputs = { width = 0.3, height = 0.2, er = 4.2, thickness = 0.035 }
expect = { z0 = 55.6389, eeff = 3.0048 }
tolerance = 1e-4
crosscheck = "vectors.py; typical 4-layer outer trace"

[[calculator]]
id = "embedded_microstrip"
name = "Embedded microstrip impedance"
group = "impedance"
summary = "Microstrip whose trace is covered by a dielectric layer (prepreg or thick mask), lowering the impedance."
model = "Hammerstad-Jensen surface microstrip plus the exponential cover correction of the effective permittivity"
inputs = [
  { name = "width", unit = "mm", range = [0.01, 100.0] },
  { name = "height", unit = "mm", range = [0.01, 10.0] },
  { name = "cover", unit = "mm", range = [0.0, 10.0], description = "dielectric above the trace top" },
  { name = "er", unit = "", range = [1.0, 20.0] },
  { name = "thickness", unit = "mm", range = [0.0, 0.5], default = 0.035 },
]
outputs = ["z0 ohm", "eeff"]
formula = """
(Z0s, eeff_s) = microstrip(w, h, er, t)
f = exp(-2 cover / h); eeff_e = eeff_s f + er (1 - f)
Z0 = Z0s sqrt(eeff_s / eeff_e)
"""
source = "The cover correction appears on calculator pages and in Wadell, 'Transmission Line Design Handbook' (Artech, 1991) ch. 3 as the usual engineering estimate; the IPC-2141 embedded form (paragraph 4.2.3) is paywalled and was criticised as wrong in the source trail (see Altium, 'Clearing trace impedance calculators and formulas', https://resources.altium.com/p/clearing-trace-impedance-calculators-and-formulas)."
validity = "cover <= 2 h. With cover >= 2 h the result approaches a fully buried line (eeff -> er) and a stripline model is better."
accuracy = "Engineering estimate, about 5 %. The UI labels it 'estimate; confirm with a field solver or the fab's stackup tool'."
[[calculator.vector]]
inputs = { width = 1.0, height = 1.6, cover = 0.1, er = 4.5, thickness = 0.035 }
expect = { z0 = 82.9155, eeff = 3.25972 }
tolerance = 1e-4
crosscheck = "sanity: 0.1 mm cover lowers 85.10 ohm by 2.6 %"
[[calculator.vector]]
inputs = { width = 0.3, height = 0.2, cover = 0.2, er = 4.2, thickness = 0.035 }
expect = { z0 = 47.9943, eeff = 4.03825 }
tolerance = 1e-4
crosscheck = "sanity: cover = h gives eeff near er"
[[calculator.vector]]
inputs = { width = 2.0, height = 1.6, cover = 1.6, er = 4.5, thickness = 0.035 }
expect = { z0 = 53.8463, eeff = 4.33103 }
tolerance = 1e-4
crosscheck = "sanity: Z0s / sqrt(er/eeff_s) limit = 62.15 * sqrt(3.2515/4.5) = 52.8 ohm, approached"

[[calculator]]
id = "stripline"
name = "Stripline impedance"
group = "impedance"
summary = "Trace centred between two planes (inner layer)."
model = "Steer 2020 closed form with thickness (as reproduced on Wikipedia 'Stripline'), equivalent to Cohn 1954"
inputs = [
  { name = "width", unit = "mm", range = [0.01, 100.0] },
  { name = "spacing", unit = "mm", range = [0.02, 20.0], description = "plane to plane distance b" },
  { name = "er", unit = "", range = [1.0, 20.0] },
  { name = "thickness", unit = "mm", range = [0.0, 0.5], default = 0.018 },
]
outputs = ["z0 ohm", "delay ps/mm"]
formula = """
W = w/b, T = t/b
Weff = W - (0.35 - W)^2 / (1 + 12 T)  if W < 0.35, else W
Cf = (2/pi) ln(1/(1-T) + 1) - (T/pi) ln(1/(1-T)^2 - 1)
Z0 = (30 pi / sqrt(er)) (1 - T) / (Weff + Cf)
delay = sqrt(er) / C0   (fully embedded: eeff = er)
"""
source = "Wikipedia, 'Stripline', formula section citing M. Steer, Microwave and RF Design (LibreTexts 3.7, 2020); original S. B. Cohn, IRE Trans. MTT-2, 1954. Cross-check: IPC-2141 form Z0 = 60/sqrt(er) ln(4 b / (0.67 pi (0.8 w + t))) as printed by NextPCB, https://www.nextpcb.com/blog/pcb-impedance-calculator-microstrip-stripline-guide (that page's variable definition for h is inconsistent; b plane-to-plane makes its example agree)."
validity = "W/(1-T) > 0.05 and T < 0.025 for the stated accuracy; symmetric only. Offset (asymmetric) stripline is a follow-up."
accuracy = "At least 1 % against the exact conformal mapping (Steer). The IPC-2141 cross-check agrees within 1.2 % on the three vectors."
[[calculator.vector]]
inputs = { width = 0.2, spacing = 0.6, er = 4.2, thickness = 0.018 }
expect = { z0 = 55.0317 }
tolerance = 1e-4
crosscheck = "IPC-2141 form with b = 0.6: 54.37 ohm (1.2 % lower)"
[[calculator.vector]]
inputs = { width = 0.12, spacing = 0.4, er = 4.2, thickness = 0.018 }
expect = { z0 = 55.7365 }
tolerance = 1e-4
crosscheck = "IPC-2141 form: 55.54 ohm"
[[calculator.vector]]
inputs = { width = 0.3, spacing = 1.0, er = 4.5, thickness = 0.035 }
expect = { z0 = 54.9677 }
tolerance = 1e-4
crosscheck = "IPC-2141 form: 54.68 ohm"

[[calculator]]
id = "coplanar_waveguide"
name = "Coplanar waveguide impedance"
group = "impedance"
summary = "Trace with ground copper on both sides on the same layer, with or without a plane underneath."
model = "Quasi-static conformal mapping (Wen 1969; Ghione and Naldi 1984) with finite substrate, elliptic integral ratio by the Hilberg approximation"
inputs = [
  { name = "width", unit = "mm", range = [0.01, 100.0] },
  { name = "gap", unit = "mm", range = [0.01, 100.0] },
  { name = "height", unit = "mm", range = [0.01, 10.0] },
  { name = "er", unit = "", range = [1.0, 20.0] },
  { name = "ground_backed", unit = "bool", default = false },
]
outputs = ["z0 ohm", "eeff", "delay ps/mm"]
formula = """
K/K'(k): for 0 <= k <= 1/sqrt2: pi / ln( 2 (1 + sqrt(k')) / (1 - sqrt(k')) ), k' = sqrt(1 - k^2);
         for 1/sqrt2 <= k <= 1: ln( 2 (1 + sqrt(k)) / (1 - sqrt(k)) ) / pi.
k1 = w / (w + 2 s)
CPW, finite substrate h:   k2 = sinh(pi w / 4h) / sinh(pi (w + 2s) / 4h)
   eeff = 1 + (er - 1)/2 * [K/K'(k2)] / [K/K'(k1)];   Z0 = 30 pi / (sqrt(eeff) K/K'(k1))
Ground-backed CPW:         k3 = tanh(pi w / 4h) / tanh(pi (w + 2s) / 4h)
   q = K/K'(k3) / (K/K'(k1) + K/K'(k3));  eeff = 1 + q (er - 1);  Z0 = 60 pi / (sqrt(eeff) (K/K'(k1) + K/K'(k3)))
Thickness ignored (Qucs eq. 12.14 to 12.18 is the optional refinement).
"""
source = "Qucs technical documentation, coplanar waveguides, https://qucs.sourceforge.net/tech/node86.html, eq. 12.4 to 12.13; scikit-rf CPW media (same equations) https://scikit-rf.readthedocs.io/en/latest/_modules/skrf/media/cpw.html."
validity = "Quasi-static; ground copper much wider than w + 2s; no thickness. Ground-backed form assumes the side grounds are tied to the plane by vias within a small fraction of a wavelength."
accuracy = "Hilberg ratio accurate to about 3e-6 (Qucs citing Gupta); formulas 'effectively exact' for the quasi-static zero-thickness case. Thickness and etch factor add a few percent."
[[calculator.vector]]
inputs = { width = 1.0, gap = 0.5, height = 1.6, er = 4.5, ground_backed = false }
expect = { z0 = 74.1723, eeff = 2.64227 }
tolerance = 1e-4
crosscheck = "Hilberg ratio checked against numeric K(k) integration at k = 1/3: 0.639630785 both"
[[calculator.vector]]
inputs = { width = 1.0, gap = 0.5, height = 1.6, er = 4.5, ground_backed = true }
expect = { z0 = 67.099, eeff = 2.85453 }
tolerance = 1e-4
crosscheck = "sanity: ground plane lowers Z0 and raises eeff"
[[calculator.vector]]
inputs = { width = 0.5, gap = 0.3, height = 1.6, er = 4.5, ground_backed = false }
expect = { z0 = 77.1232, eeff = 2.71546 }
tolerance = 1e-4
crosscheck = "vectors.py"
[[calculator.vector]]
inputs = { width = 1.0, gap = 0.2, height = 0.2, er = 4.2, ground_backed = true }
expect = { z0 = 25.8399, eeff = 3.38531 }
tolerance = 1e-4
crosscheck = "sanity: wide trace on thin dielectric is low impedance, near the microstrip value for w/h = 5"

[[calculator]]
id = "differential_pair"
name = "Differential pair impedance"
group = "impedance"
summary = "Differential impedance of two equal surface traces side by side, and the gap or width for a target."
model = "Hammerstad-Jensen single-ended Z0 times the edge-coupling factor 2 (1 - 0.48 exp(-0.96 s/h)), widely attributed to IPC-2141"
inputs = [
  { name = "width", unit = "mm", range = [0.01, 100.0] },
  { name = "gap", unit = "mm", range = [0.01, 100.0] },
  { name = "height", unit = "mm", range = [0.01, 10.0] },
  { name = "er", unit = "", range = [1.0, 20.0] },
  { name = "thickness", unit = "mm", range = [0.0, 0.5], default = 0.035 },
  { name = "target", unit = "ohm", range = [10.0, 1000.0], optional = true },
]
outputs = ["zdiff ohm", "z0_single ohm", "width_for_target mm (gap held)", "coupling_factor"]
formula = "Zdiff = 2 Z0(w, h, er, t) (1 - 0.48 exp(-0.96 s / h)); width_for_target by bisection with s fixed."
source = "Coupling factor as printed by NextPCB differential microstrip calculator https://www.nextpcb.com/differential-microstrip-impedance-calculator and many others, attributed to IPC-2141 (paywalled; TOC at https://www.ipc.org/TOC/IPC-2141A.pdf lists 4.4.1 edge-coupled surface microstrip). Not confirmed against the standard text (pcbcraft-research/research-283-length-impedance.md). Upgrade path: Hammerstad-Jensen coupled microstrip even/odd modes, Qucs https://qucs.sourceforge.net/tech/node77.html, odd-mode error under 0.3 %."
validity = "0.1 <= w/h <= 10, s/h >= 0.1, loosely coupled pairs (s >= w). For s < w the factor underestimates coupling."
accuracy = "Unverified against the standard; treat as +-10 %. The UI shows the word 'estimate' and the follow-up issue swaps in the coupled H-J model."
[[calculator.vector]]
