[[calculator]]
id = "resistor_code"
name = "Resistor colour code and SMD code"
group = "components"
summary = "Decode colour bands (4, 5 or 6) and SMD markings (3-digit, 4-digit, R-notation, EIA-96), or encode a value."
inputs = [
  { name = "bands", unit = "colour names", array = [3, 6], optional = true },
  { name = "smd_code", unit = "text", pattern = "^[0-9R]{3,4}$|^[0-9]{2}[A-Z]$", optional = true },
  { name = "value", unit = "ohm", range = [1.0e-3, 1.0e12], optional = true, description = "encode mode" },
]
outputs = ["resistance ohm", "tolerance %", "tempco ppm/K", "bands", "smd_3digit", "smd_eia96"]
formula = """
Colour digits: black 0 brown 1 red 2 orange 3 yellow 4 green 5 blue 6 violet 7 grey 8 white 9.
Multiplier: same digit as power of ten; gold 0.1, silver 0.01, pink 0.001.
Tolerance: brown 1 % (F), red 2 % (G), green 0.5 % (D), blue 0.25 % (C), violet 0.1 % (B), grey 0.01 % (L), gold 5 % (J), silver 10 % (K), none 20 % (M).
Tempco (6th band): brown 100, red 50, orange 15, yellow 25, blue 10, violet 5 ppm/K.
4 bands = 2 digits + multiplier + tolerance; 5 bands = 3 digits + multiplier + tolerance; 6 = 5 + tempco.
SMD: 3-digit "ABC" = AB * 10^C; 4-digit "ABCD" = ABC * 10^D; "R" marks the decimal point (4R7 = 4.7, R10 = 0.10).
EIA-96 "NNL": NN is the 1-based index into E96 (01 = 1.00 ... 96 = 9.76, three significant digits), L is the multiplier letter:
  Z 0.001, Y or R 0.01, X or S 0.1, A 1, B or H 10, C 100, D 1000, E 10000, F 100000.
"""
source = "Wikipedia, 'Electronic color code' (IEC 60062:2016 table; checked 2026-10-28). EIA-96 letters: xdevs resistor SMD code guide https://xdevs.com/guide/rescode/ and pimylifeup SMD resistor guide https://pimylifeup.com/smd-resistor/ (both agree on Z Y/R X/S A B/H C D E F)."
