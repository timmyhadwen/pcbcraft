# ---------------------------------------------------------------- spacing and safety

[[calculator]]
id = "conductor_spacing_ipc2221"
name = "Conductor spacing by voltage (IPC-2221)"
group = "spacing"
summary = "Minimum copper to copper spacing for a peak voltage, by board location class B1 to A7."
inputs = [
  { name = "voltage", unit = "V peak", range = [0.0, 100000.0] },
  { name = "location", unit = "enum", values = ["B1", "B2", "B3", "B4", "A5", "A6", "A7"], default = "B2" },
]
outputs = ["spacing mm", "row_label", "location_description"]
formula = """
Table lookup (V peak, mm) by column B1 internal | B2 external uncoated to 3050 m | B3 external uncoated above 3050 m | B4 external polymer coated | A5 assembly conformal coated | A6 component lead uncoated | A7 component lead coated:
  <=15:   0.05 0.1  0.1  0.05 0.13 0.13 0.13
  <=30:   0.05 0.1  0.1  0.05 0.13 0.25 0.13
  <=50:   0.1  0.6  0.6  0.13 0.13 0.4  0.13
  <=100:  0.1  0.6  1.5  0.13 0.13 0.5  0.13
  <=150:  0.2  0.6  3.2  0.4  0.4  0.8  0.4
  <=170:  0.2  1.25 3.2  0.4  0.4  0.8  0.4
  <=250:  0.2  1.25 6.4  0.4  0.4  0.8  0.4
  <=300:  0.2  2.5  12.5 0.4  0.4  0.8  0.8
  <=500:  0.25 2.5  12.5 0.8  0.8  1.5  0.8
  >500:   per volt 0.0025 0.005 0.025 0.00305 0.00305 0.00305 0.00305 (spacing = V * slope)
"""
source = "Reproductions of IPC-2221B table 6-1: Philip McGaw, 'Creepage and clearance' (sources/standards/ipc2221-spacing-philipmcgaw.txt), SFCircuits PCB School (sources/standards/ipc2221-spacing-sfcircuits.txt), Altium high-voltage calculator page (sources/standards/ipc2221-spacing-altium.txt); the standard is paywalled (IPC-2221C, shop.ipc.org)."
validity = "IPC-2221 is a design standard, not a safety standard; for mains or anything a person can touch use creepage_clearance_iec60664 and the product safety standard. Solder mask does not count as the B4 coating."
accuracy = "Table values reproduced identically by three secondary sources; the >500 V slopes are the standard's own linear extension."
[[calculator.vector]]
inputs = { voltage = 48, location = "B2" }
expect = { spacing = 0.6 }
tolerance = 1e-9
crosscheck = "row 31 to 50 V, external uncoated"
[[calculator.vector]]
inputs = { voltage = 325.3, location = "B2" }
expect = { spacing = 2.5 }
tolerance = 1e-9
crosscheck = "230 V RMS mains peak 325 V, row 301 to 500 V"
[[calculator.vector]]
inputs = { voltage = 325.3, location = "B4" }
expect = { spacing = 0.8 }
tolerance = 1e-9
crosscheck = "same row, coated column"
[[calculator.vector]]
inputs = { voltage = 1000, location = "B2" }
expect = { spacing = 5.0 }
tolerance = 1e-9
crosscheck = "1000 * 0.005"
[[calculator.vector]]
inputs = { voltage = 1000, location = "B1" }
expect = { spacing = 2.5 }
tolerance = 1e-9
crosscheck = "1000 * 0.0025"

[[calculator]]
id = "creepage_clearance_iec60664"
name = "Creepage and clearance (IEC 60664-1 lookup)"
group = "spacing"
summary = "Minimum clearance through air for the impulse voltage and creepage along the surface for the working voltage, pollution degree and material group."
inputs = [
  { name = "working_voltage", unit = "V RMS", range = [10.0, 1000.0] },
  { name = "mains_voltage", unit = "V RMS", range = [50.0, 1000.0], description = "nominal mains voltage line to neutral, picks the impulse voltage" },
  { name = "overvoltage_category", unit = "enum", values = ["I", "II", "III", "IV"], default = "II" },
  { name = "pollution_degree", unit = "enum", values = ["1", "2", "3"], default = "2" },
  { name = "material_group", unit = "enum", values = ["I", "II", "IIIa", "IIIb"], default = "IIIa", description = "from CTI: I >= 600, II 400 to 599, IIIa 175 to 399, IIIb 100 to 174" },
  { name = "insulation", unit = "enum", values = ["functional", "basic", "reinforced"], default = "basic" },
  { name = "altitude", unit = "m", range = [0.0, 5000.0], default = 2000 },
]
outputs = ["impulse_voltage kV", "clearance mm", "creepage mm", "notes"]
formula = """
1. Rated impulse voltage (Table F.1), by mains voltage ceiling (V) and overvoltage category I/II/III/IV in kV:
   <=50: 0.33 0.5 0.8 1.5 | <=100: 0.5 0.8 1.5 2.5 | <=150: 0.8 1.5 2.5 4.0 | <=300: 1.5 2.5 4.0 6.0 | <=600: 2.5 4.0 6.0 8.0 | <=1000: 4.0 6.0 8.0 12.0
2. Clearance (Table F.2, inhomogeneous field, up to 2000 m) by impulse kV -> mm:
   0.33: 0.01 | 0.5: 0.04 | 0.8: 0.1 | 1.5: 0.5 | 2.5: 1.5 | 4.0: 3.0 | 6.0: 5.5 | 8.0: 8.0 | 12: 14
   pollution degree 2 floor 0.2 mm, degree 3 floor 0.8 mm. Altitude above 2000 m: multiply by the F.8 factor (2000 m 1.00, 3000 m 1.14, 4000 m 1.29, 5000 m 1.48).
   reinforced: use the impulse voltage one step higher in the F.1 ladder.
3. Creepage (Table F.5) by working voltage ceiling, pollution degree 1 (all groups) | degree 2 group I, II, III | degree 3 group I, II, III in mm:
    50: 0.18 | 0.6  0.85 1.2  | 1.5 1.7 1.9
    63: 0.2  | 0.63 0.9  1.25 | 1.6 1.8 2.0
    80: 0.22 | 0.67 0.95 1.3  | 1.7 1.9 2.1
   100: 0.25 | 0.71 1.0  1.4  | 1.8 2.0 2.2
   125: 0.28 | 0.75 1.05 1.5  | 1.9 2.1 2.4
   160: 0.32 | 0.8  1.1  1.6  | 2.0 2.2 2.5
   200: 0.42 | 1.0  1.4  2.0  | 2.5 2.8 3.2
   250: 0.56 | 1.25 1.8  2.5  | 3.2 3.6 4.0
   320: 0.75 | 1.6  2.2  3.2  | 4.0 4.5 5.0
   400: 1.0  | 2.0  2.8  4.0  | 5.0 5.6 6.3
   500: 1.3  | 2.5  3.6  5.0  | 6.3 7.1 8.0
   630: 1.8  | 3.2  4.5  6.3  | 8.0 9.0 10.0
   800: 2.4  | 4.0  5.6  8.0  | 10.0 11.0 12.5
  1000: 3.2  | 5.0  7.1  10.0 | 12.5 14.0 16.0
   reinforced creepage = 2 x basic. Creepage is never less than clearance: result = max(creepage, clearance).
"""
source = "IEC 60664-1:2020 (paywalled, https://webstore.iec.ch/en/publication/59671). Table values from secondary reproductions: PTR Hartmann (sources/standards/creepage-ptr-hartmann.txt), Wurth Elektronik creepage and clearance of connectors PDF, Battery Design creepage calculator, VIOX IEC 60664-1 calculator (sources/standards/creepage-viox-calc.txt), Elektor parts 1 to 3 (sources/standards/creepage-elektor-part*.txt), TI SLUP421 and SLUAAR5 (sources/standards/iec60664-ti-*.pdf). Material group thresholds from IEC 60664-1 clause 4.8.1.3 as quoted by TI SLUAAR5."
validity = "Low-voltage equipment up to 1000 V RMS, frequency to 30 kHz. Product standards (IEC 62368-1, 60335, 61010, 60601) override these with their own tables. Secondary reproductions: the implementer must verify every row against the standard before the panel drops the 'verify' label."
accuracy = "Lookup; values are the standard's own. The panel shows 'reproduced from secondary sources, verify against IEC 60664-1' until a licensed copy has been checked."
[[calculator.vector]]
inputs = { working_voltage = 230, mains_voltage = 230, overvoltage_category = "II", pollution_degree = "2", material_group = "IIIa", insulation = "basic" }
expect = { impulse_voltage = 2.5, clearance = 1.5, creepage = 2.5 }
tolerance = 1e-9
crosscheck = "Elektor part 2 worked example: 230 V mains, OVC II, PD2, group III: 1.5 mm clearance, 2.5 mm creepage (sources/standards/creepage-elektor-part2.txt)"
[[calculator.vector]]
inputs = { working_voltage = 230, mains_voltage = 230, overvoltage_category = "II", pollution_degree = "2", material_group = "IIIa", insulation = "reinforced" }
expect = { impulse_voltage = 4.0, clearance = 3.0, creepage = 5.0 }
tolerance = 1e-9
crosscheck = "reinforced: next impulse step 4 kV -> 3.0 mm; creepage doubled to 5.0 mm (the usual 'about 5 mm' mains reinforced figure)"
[[calculator.vector]]
