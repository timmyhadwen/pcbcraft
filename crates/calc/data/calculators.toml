[[calculator]]
id = "e_series"
name = "E-series nearest value"
group = "components"
summary = "Nearest standard value in E6, E12, E24, E48, E96 or E192, the neighbours either side, and the error."
inputs = [
  { name = "value", unit = "ohm | F | H", range = [1.0e-15, 1.0e15] },
  { name = "series", unit = "enum", values = ["E6", "E12", "E24", "E48", "E96", "E192"], default = "E24" },
]
outputs = ["nearest", "below", "above", "error %"]
formula = """
Base values: v_i = round(10^(i/N)) to 2 significant digits for N <= 24, 3 for N >= 48, i = 0..N-1.
E24 overrides (IEC 60063 keeps the historic values): 2.6->2.7 2.9->3.0 3.2->3.3 3.5->3.6 3.8->3.9 4.2->4.3 4.6->4.7 8.3->8.2.
E6 and E12 are every 4th and every 2nd E24 value. E192 override: index 185 is 9.20 (formula gives 9.19).
Nearest: minimise |ln(candidate / value)| over the decade's values plus 10 x the first of the next decade.
"""
source = "Wikipedia, 'E series of preferred numbers' (IEC 60063 lists, formula, the eight E24 exceptions and the E192 9.20 exception; checked 2026-10-28)."
validity = "Any unit; the series is dimensionless."
accuracy = "exact against IEC 60063"
[[calculator.vector]]
inputs = { value = 4500, series = "E24" }
expect = { nearest = 4700 }
tolerance = 1e-9
crosscheck = "4.3 is 4.5 % low, 4.7 is 4.4 % high; log distance picks 4.7"
[[calculator.vector]]
inputs = { value = 4500, series = "E96" }
expect = { nearest = 4530 }
tolerance = 1e-9
crosscheck = "E96 has 4.42 and 4.53"
[[calculator.vector]]
inputs = { value = 123, series = "E12" }
expect = { nearest = 120 }
tolerance = 1e-9
crosscheck = "E12 neighbours 120 and 150"
[[calculator.vector]]
inputs = { value = 123, series = "E96" }
expect = { nearest = 124 }
tolerance = 1e-9
crosscheck = "E96 has 1.21 and 1.24"
[[calculator.vector]]
inputs = { value = 0.47, series = "E6" }
expect = { nearest = 0.47 }
tolerance = 1e-9
crosscheck = "exact member"
[[calculator.vector]]
inputs = { value = 9.9, series = "E24" }
expect = { nearest = 10 }
tolerance = 1e-9
crosscheck = "decade wrap: 9.1 vs 10"

[[calculator]]
id = "unit_converter"
name = "Unit converter"
group = "utilities"
summary = "mil, mm, inch, micron and copper weight in oz/ft2."
inputs = [
  { name = "value", unit = "", range = [-1.0e9, 1.0e9] },
  { name = "from", unit = "enum", values = ["mm", "mil", "inch", "um", "oz"] },
  { name = "to", unit = "enum", values = ["mm", "mil", "inch", "um", "oz"] },
]
outputs = ["value"]
formula = "1 inch = 25.4 mm exactly; 1 mil = 0.0254 mm; 1 oz/ft2 copper = 34.79 um (fabs round to 35 um; 0.5 oz = 17.4 um, 2 oz = 69.6 um). oz converts only to and from length units as a thickness."
source = "Inch definition: NIST SP 811. Copper weight: 1 oz over 1 ft2 of copper (density 8.96 g/cm3) is 34.79 um; stated in IPC-4562 and every fab capability page (sources/standards/jlcpcb-pcb-capabilities.txt, eurocircuits-copper-layers.txt)."
validity = "Exact conversions."
accuracy = "exact"
[[calculator.vector]]
inputs = { value = 10, from = "mil", to = "mm" }
expect = { value = 0.254 }
tolerance = 1e-12
crosscheck = "definition"
[[calculator.vector]]
inputs = { value = 1, from = "mm", to = "mil" }
expect = { value = 39.3701 }
tolerance = 1e-5
crosscheck = "1/0.0254"
[[calculator.vector]]
inputs = { value = 2, from = "oz", to = "um" }
expect = { value = 69.58 }
tolerance = 1e-9
crosscheck = "2 * 34.79"
[[calculator.vector]]
inputs = { value = 35, from = "um", to = "oz" }
expect = { value = 1.00604 }
tolerance = 1e-5
crosscheck = "35 / 34.79"

[[calculator]]
id = "thermal_via_count"
name = "Thermal via count"
group = "utilities"
summary = "How many plated vias under a hot pad reach a target thermal resistance to the plane on the other side."
inputs = [
  { name = "drill", unit = "mm", range = [0.1, 1.0] },
  { name = "plating", unit = "um", range = [10.0, 50.0], default = 25 },
  { name = "length", unit = "mm", range = [0.1, 5.0], default = 1.6 },
  { name = "target_rth", unit = "K/W", range = [0.1, 100.0] },
  { name = "filled", unit = "bool", default = false, description = "solder or copper filled barrel: counts the full drill area" },
]
outputs = ["rth_one_via K/W", "count", "array_hint (square side)"]
formula = """
A = pi/4 ((drill + 2 plating)^2 - drill^2)   (filled: pi/4 (drill + 2 plating)^2)
Rth_via = length / (K_CU A);  count = ceil(Rth_via / target_rth);  array_hint = ceil(sqrt(count)).
"""
source = "Series thermal resistance of a cylinder, k_copper = 385 W/(m K) (CRC Handbook). Context: TI SLVA959 motor driver layout and SLYT614 buck layout notes on thermal vias (sources/netrules/ti-slva959-*.txt, ti-slyt614-*.txt)."
validity = "Conduction through the barrel only; ignores the FR-4 in parallel (negligible), the spreading resistance in the pad and the plane, and solder wicking. Real packages see 2 to 3 times the ideal count's benefit tail off after about 9 to 16 vias."
accuracy = "order of magnitude"
[[calculator.vector]]
inputs = { drill = 0.3, plating = 25, length = 1.6, target_rth = 5 }
expect = { rth_one_via = 162.812, count = 33 }
tolerance = 1e-4
crosscheck = "1.6e-3 / (385 * 2.5525e-8) = 162.8 K/W"
[[calculator.vector]]
inputs = { drill = 0.3, plating = 25, length = 1.6, target_rth = 2 }
expect = { rth_one_via = 162.812, count = 82 }
tolerance = 1e-4
crosscheck = "ceil(162.8/2)"
[[calculator.vector]]
inputs = { drill = 0.2, plating = 20, length = 1.0, target_rth = 10 }
expect = { rth_one_via = 187.904, count = 19 }
tolerance = 1e-4
crosscheck = "A = 0.013823 mm2"
