# Flatpak manifest for the single-file bundle built in CI
# (pcbcraft-<dist-tag>-linux-<arch>.flatpak). Build with packaging/linux/flatpak-bundle.sh.
#
# Repackages the release Linux tarball (pcbcraft-<dist-tag>-linux-<arch>.tar.gz from
# packaging/linux/package.sh) instead of compiling Rust inside flatpak-builder: no network
# during the build, and the same binaries as the AppImage, deb, and rpm. The binaries need
# glibc >= 2.35 and load X11, Wayland, xkbcommon, and Vulkan at runtime; the freedesktop
# runtime supplies those libraries, and the GPU driver comes from its GL extension.
# Adapted from SolidCraft packaging (bherbruck/solidcraft; MIT OR Apache-2.0; see ATTRIBUTION.md).
id: io.github.tangency-labs.pcbcraft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: pcbcraft
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-documents
modules:
  - name: pcbcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/pcbcraft /app/bin/pcbcraft
      - install -Dm755 bin/pcbcraft-cli /app/bin/pcbcraft-cli
      - install -Dm644 share/applications/io.github.tangency-labs.pcbcraft.desktop /app/share/applications/io.github.tangency-labs.pcbcraft.desktop
      - install -Dm644 share/mime/packages/io.github.tangency-labs.pcbcraft.xml /app/share/mime/packages/io.github.tangency-labs.pcbcraft.xml
      - install -Dm644 share/metainfo/io.github.tangency-labs.pcbcraft.metainfo.xml /app/share/metainfo/io.github.tangency-labs.pcbcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/pcbcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
