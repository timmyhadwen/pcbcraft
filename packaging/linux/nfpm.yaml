# .deb and .rpm packages (nfpm). Run by packaging/linux/package.sh.
# Adapted from SolidCraft (bherbruck/solidcraft; MIT OR Apache-2.0; see ATTRIBUTION.md).
name: pcbcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: electronics
priority: optional
maintainer: ${PCBCRAFT_MAINTAINER}
vendor: PCBCraft contributors
homepage: https://github.com/tangency-labs/pcbcraft
license: GPL-3.0-or-later
description: |-
  Open-source Rust PCB design: schematic, layout, checks, and KiCad export.
  Includes pcbcraft-cli for headless commands and an MCP server for agents.

overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libvulkan1 | libegl1
    recommends:
      - mesa-vulkan-drivers
      - libegl-mesa0
      - xdg-desktop-portal
  rpm:
    depends:
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/pcbcraft
    dst: /usr/bin/pcbcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/pcbcraft-cli
    dst: /usr/bin/pcbcraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
