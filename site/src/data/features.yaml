# Feature list for the marketing site: the home page section and /features/.
# Context: one entry per shipped feature. Both pages read this file (src/lib/features.ts).
# Rules: every entry needs at least one `evidence` item, or the build fails.
#   evidence prefixes: command:<engine command id>, mcp:<tool name>, test:<test fn name>,
#   issue:#<merged issue number>, file:<path in the repo>.
#   status: browser (desktop and browser build), available (shipped in the desktop app,
#   browser behaviour not checked), desktop (needs files or sockets, desktop only).
#   key: true puts the entry in the short list on the home page (at most 4 per area).
# Do not: add an entry without proof, name another EDA tool, or claim more than the evidence shows.
# #718 owns the wording and adds the rest; these entries are the seed.

# ---------- Schematic ----------
- area: schematic
  name: Wires and buses
  summary: Draw free-form wires with your own vertices, and multi-net buses named like DB*8.
  status: browser
  key: true
  evidence: [command:wire.draw, command:wire.draw_bus]
- area: schematic
  name: Pages and hierarchy ports
  summary: Add named schematic pages and hand a net from one page to another with a port.
  status: browser
  key: true
  evidence: [command:schematic.new_sheet, command:schematic.place_port]
- area: schematic
  name: Labels and no-connect flags
  summary: Name nets with labels and mark pins that are meant to stay unconnected.
  status: browser
  key: true
  evidence: [command:label.place, command:pin.no_connect]
- area: schematic
  name: Parts table on the sheet
  summary: Draw a table of every component and its properties as ordinary graphics.
  status: browser
  key: true
  evidence: [command:schematic.table]
- area: schematic
  name: Net chain walk
  summary: Follow a net from a pin through two-pin parts in series and see where it ends.
  status: browser
  evidence: [command:net.chain]
- area: schematic
  name: Code 39 barcodes
  summary: Draw a Code 39 barcode of up to 48 characters as bar graphics.
  status: browser
  evidence: [command:barcode.place]

# ---------- Board layout and routing ----------
- area: layout
  name: Routing with 45-degree steps
  summary: Connect two points on a copper layer around other copper, with an optional shove mode.
  status: browser
  key: true
  evidence: [command:track.route]
- area: layout
  name: Differential pairs
  summary: Route both nets of a declared pair together with coupled geometry.
  status: browser
  key: true
  evidence: [command:track.route_pair, test:a_newcomer_routes_a_pair_in_one_drag]
- area: layout
  name: Length tuning
  summary: Replace a straight track with a serpentine until the net reaches a target length.
  status: browser
  key: true
  evidence: [command:track.tune_length]
- area: layout
  name: Copper zones
  summary: Pour zones with thermal spokes and read back the copper a zone really fills.
  status: browser
  key: true
  evidence: [command:zone.pour, command:zone.fill]
- area: layout
  name: Via stitching
  summary: Fill a rectangle with a grid of vias on an existing net.
  status: browser
  evidence: [command:via.stitch]
- area: layout
  name: Teardrops
  summary: Grow teardrop copper where tracks meet pads and vias.
  status: browser
  evidence: [command:teardrop.add]
- area: layout
  name: Step and repeat
  summary: Clone a placed footprint into a grid of numbered copies, undone in one step.
  status: browser
  evidence: [command:footprint.array]
- area: layout
  name: Edge connectors and castellated pads
  summary: Dock a footprint flush against a board edge and flag castellated pads.
  status: browser
  evidence: [command:footprint.dock_edge, command:footprint.set_castellated]
- area: layout
  name: Round cutouts
  summary: Add dimensioned circular cutouts to the board outline.
  status: browser
  evidence: [command:board.cutout.add]
- area: layout
  name: Assembly marks
  summary: Place bare copper fiducials that the pick and place camera uses to find the board.
  status: browser
  evidence: [command:board.fiducial_place, test:a_newcomer_adds_assembly_marks_for_the_build_camera]
- area: layout
  name: Panel planning
  summary: Plan a panel of board copies with gaps and rails and read the finished size.
  status: browser
  evidence: [command:board.panel, test:a_newcomer_plans_a_panel_of_board_copies]
- area: layout
  name: Assembly variants
  summary: Describe a build that leaves parts off or swaps a package, and export its bill of materials.
  status: browser
  evidence: [command:variant.create, test:a_newcomer_describes_a_build_that_leaves_a_part_off]

